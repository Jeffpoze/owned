name: text_reader
description: On-device text recognition and subject cut-out for Owned. Apple Vision on iOS, Google ML Kit on Android.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.jeffpoze.owned.textreader
        pluginClass: TextReaderPlugin
      ios:
        pluginClass: TextReaderPlugin
